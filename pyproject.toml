[project]
name = "jspace"
version = "0.1.0"
description = "Testing global faithfulness of J-space (Jacobian lens) readouts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
models = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
analysis = [
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
